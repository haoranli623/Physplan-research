<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 760" role="img" aria-labelledby="title desc">
  <title id="title">Mobile diagnosis-before-repair workflow</title>
  <desc id="desc">A vertical sequence measures recoverable headroom, identifies the dominant bottleneck, applies a targeted intervention, and compares it against a control or wrong-layer intervention.</desc>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 Z" fill="#7f8e9a"/></marker>
  </defs>
  <rect width="500" height="760" rx="16" fill="#ffffff"/>
  <g font-family="Arial, Helvetica, sans-serif">
    <g fill="none" stroke="#7f8e9a" stroke-width="3" marker-end="url(#arrow)">
      <path d="M250 155 V193"/><path d="M250 325 V363"/><path d="M250 495 V533"/>
    </g>

    <g transform="translate(55 25)">
      <rect width="390" height="130" rx="15" fill="#f5f8fa" stroke="#b9c5ce" stroke-width="2.5"/>
      <circle cx="38" cy="38" r="21" fill="#17212b"/><text x="38" y="45" text-anchor="middle" font-size="19" font-weight="700" fill="#ffffff">1</text>
      <path d="M88 48 H325 M88 70 H285 M88 92 H310" stroke="#2f6f9f" stroke-width="5" stroke-linecap="round"/>
      <text x="195" y="116" text-anchor="middle" font-size="21" font-weight="700" fill="#17212b">Measure recoverable headroom</text>
    </g>
    <g transform="translate(55 195)">
      <rect width="390" height="130" rx="15" fill="#e9f2f8" stroke="#2f6f9f" stroke-width="2.5"/>
      <circle cx="38" cy="38" r="21" fill="#17212b"/><text x="38" y="45" text-anchor="middle" font-size="19" font-weight="700" fill="#ffffff">2</text>
      <path d="M130 61 L172 96 L250 31" fill="none" stroke="#2f6f9f" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="195" y="116" text-anchor="middle" font-size="21" font-weight="700" fill="#17212b">Identify dominant bottleneck</text>
    </g>
    <g transform="translate(55 365)">
      <rect width="390" height="130" rx="15" fill="#fbf1e5" stroke="#b86b18" stroke-width="2.5"/>
      <circle cx="38" cy="38" r="21" fill="#17212b"/><text x="38" y="45" text-anchor="middle" font-size="19" font-weight="700" fill="#ffffff">3</text>
      <circle cx="195" cy="63" r="35" fill="none" stroke="#b86b18" stroke-width="4"/><circle cx="195" cy="63" r="18" fill="none" stroke="#b86b18" stroke-width="4"/><circle cx="195" cy="63" r="5" fill="#b86b18"/>
      <path d="M220 38 L253 12" stroke="#b86b18" stroke-width="5" stroke-linecap="round"/>
      <text x="195" y="116" text-anchor="middle" font-size="21" font-weight="700" fill="#17212b">Apply targeted intervention</text>
    </g>
    <g transform="translate(55 535)">
      <rect width="390" height="145" rx="15" fill="#eaf5f3" stroke="#2a7f78" stroke-width="2.5" stroke-dasharray="7 5"/>
      <circle cx="38" cy="38" r="21" fill="#17212b"/><text x="38" y="45" text-anchor="middle" font-size="19" font-weight="700" fill="#ffffff">4</text>
      <path d="M103 90 V48 H151 M151 90 V28 H199 M199 90 V66 H247" fill="none" stroke="#2a7f78" stroke-width="4"/>
      <text x="195" y="116" text-anchor="middle" font-size="20" font-weight="700" fill="#17212b">Compare with control / wrong-layer</text>
      <text x="195" y="137" text-anchor="middle" font-size="18" font-weight="700" fill="#17212b">intervention</text>
    </g>
    <text x="250" y="718" text-anchor="middle" font-size="17" fill="#5b6875">Headroom is diagnostic; gaps are not additive causal components.</text>
  </g>
</svg>
