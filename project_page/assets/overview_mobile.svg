<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 900" role="img" aria-labelledby="title desc">
  <title id="title">Mobile PhysPlan planning-interface diagram</title>
  <desc id="desc">A vertical flow from search and proposal through candidate actions, world-model prediction, decision-metric scoring, elite selection, and environment outcome. A feedback arrow shows elite selection updating the next search proposal. Prediction, decision metric, and search-selection coverage interfaces are labeled.</desc>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 Z" fill="#81909d"/></marker>
    <marker id="feedback" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 Z" fill="#2a7f78"/></marker>
    <pattern id="metricPattern" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="7" height="7" fill="#fbf1e5"/><line x1="0" y1="0" x2="0" y2="7" stroke="#d89a58" stroke-width="2"/></pattern>
  </defs>
  <rect width="500" height="900" rx="16" fill="#ffffff"/>
  <g font-family="Arial, Helvetica, sans-serif">
    <g fill="none" stroke="#81909d" stroke-width="3" marker-end="url(#arrow)">
      <path d="M250 140 V174"/><path d="M250 275 V309"/><path d="M250 410 V444"/><path d="M250 545 V579"/><path d="M250 680 V714"/>
    </g>

    <g>
      <rect x="92" y="35" width="316" height="105" rx="14" fill="#eaf5f3" stroke="#2a7f78" stroke-width="2.5" stroke-dasharray="7 5"/>
      <text x="250" y="75" text-anchor="middle" font-size="23" font-weight="700" fill="#17212b">Search / proposal</text>
      <rect x="133" y="92" width="234" height="30" rx="15" fill="#ffffff" stroke="#2a7f78" stroke-width="1.5" stroke-dasharray="5 3"/>
      <text x="250" y="112" text-anchor="middle" font-size="16" font-weight="700" fill="#20635e">SEARCH / SELECTION COVERAGE</text>
    </g>
    <g>
      <rect x="92" y="175" width="316" height="100" rx="14" fill="#f5f8fa" stroke="#b9c5ce" stroke-width="2.5"/>
      <path d="M154 218 H332 M154 236 H300 M154 254 H320" stroke="#5b6875" stroke-width="4" stroke-linecap="round"/>
      <text x="250" y="207" text-anchor="middle" font-size="22" font-weight="700" fill="#17212b">Candidate actions</text>
    </g>
    <g>
      <rect x="92" y="310" width="316" height="100" rx="14" fill="#e9f2f8" stroke="#2f6f9f" stroke-width="2.5"/>
      <text x="250" y="349" text-anchor="middle" font-size="22" font-weight="700" fill="#17212b">World-model prediction</text>
      <rect x="183" y="368" width="134" height="28" rx="14" fill="#2f6f9f"/>
      <text x="250" y="387" text-anchor="middle" font-size="17" font-weight="700" fill="#ffffff">PREDICTION</text>
    </g>
    <g>
      <rect x="92" y="445" width="316" height="100" rx="14" fill="url(#metricPattern)" stroke="#b86b18" stroke-width="2.5"/>
      <text x="250" y="484" text-anchor="middle" font-size="22" font-weight="700" fill="#17212b">Decision metric</text>
      <rect x="165" y="503" width="170" height="28" rx="14" fill="#ffffff" stroke="#b86b18" stroke-width="1.5"/>
      <text x="250" y="522" text-anchor="middle" font-size="17" font-weight="700" fill="#8c5112">DECISION METRIC</text>
    </g>
    <g>
      <rect x="92" y="580" width="316" height="100" rx="14" fill="#eaf5f3" stroke="#2a7f78" stroke-width="2.5"/>
      <text x="250" y="619" text-anchor="middle" font-size="22" font-weight="700" fill="#17212b">Elite set / selection</text>
      <rect x="133" y="638" width="234" height="28" rx="14" fill="#ffffff" stroke="#2a7f78" stroke-width="1.5" stroke-dasharray="5 3"/>
      <text x="250" y="657" text-anchor="middle" font-size="16" font-weight="700" fill="#20635e">SEARCH / SELECTION COVERAGE</text>
    </g>
    <g>
      <rect x="92" y="715" width="316" height="100" rx="14" fill="#17212b"/>
      <circle cx="250" cy="756" r="17" fill="#ffffff"/><path d="M242 756 L248 762 L260 748" fill="none" stroke="#2a7f78" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="250" y="797" text-anchor="middle" font-size="22" font-weight="700" fill="#ffffff">Environment outcome</text>
    </g>

    <path d="M408 630 H458 V87 H408" fill="none" stroke="#2a7f78" stroke-width="3" stroke-dasharray="8 6" marker-end="url(#feedback)"/>
    <text transform="translate(476 360) rotate(-90)" text-anchor="middle" font-size="17" font-weight="700" fill="#20635e">CEM feedback: elites update the proposal</text>
    <text x="250" y="858" text-anchor="middle" font-size="17" fill="#5b6875">Interface gaps measure recoverable headroom.</text>
    <text x="250" y="881" text-anchor="middle" font-size="17" fill="#5b6875">They are not assumed to be additive causal effects.</text>
  </g>
</svg>
