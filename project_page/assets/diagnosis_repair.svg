<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 280" role="img" aria-labelledby="title desc">
  <title id="title">Diagnosis before repair workflow</title>
  <desc id="desc">A four-stage sequence measures recoverable headroom, identifies a dominant bottleneck, applies a targeted intervention, and compares it with a control or wrong-layer intervention.</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#7f8e9a"/>
    </marker>
  </defs>
  <rect width="960" height="280" rx="16" fill="#ffffff"/>
  <g font-family="Arial, Helvetica, sans-serif">
    <g fill="none" stroke="#7f8e9a" stroke-width="2" marker-end="url(#arrow)">
      <path d="M215 132 H265"/>
      <path d="M455 132 H505"/>
      <path d="M695 132 H745"/>
    </g>

    <g transform="translate(25 62)">
      <rect width="190" height="140" rx="14" fill="#f5f8fa" stroke="#b9c5ce" stroke-width="2"/>
      <circle cx="30" cy="30" r="17" fill="#17212b"/>
      <text x="30" y="36" text-anchor="middle" font-size="16" font-weight="700" fill="#ffffff">1</text>
      <path d="M49 72 H139 M49 90 H164 M49 108 H119" stroke="#2f6f9f" stroke-width="5" stroke-linecap="round"/>
      <text x="95" y="128" text-anchor="middle" font-size="15" font-weight="700" fill="#17212b">Measure headroom</text>
    </g>

    <g transform="translate(265 62)">
      <rect width="190" height="140" rx="14" fill="#e9f2f8" stroke="#2f6f9f" stroke-width="2"/>
      <circle cx="30" cy="30" r="17" fill="#17212b"/>
      <text x="30" y="36" text-anchor="middle" font-size="16" font-weight="700" fill="#ffffff">2</text>
      <path d="M61 67 L91 103 L139 51" fill="none" stroke="#2f6f9f" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="95" y="128" text-anchor="middle" font-size="15" font-weight="700" fill="#17212b">Identify bottleneck</text>
    </g>

    <g transform="translate(505 62)">
      <rect width="190" height="140" rx="14" fill="#fbf1e5" stroke="#b86b18" stroke-width="2"/>
      <circle cx="30" cy="30" r="17" fill="#17212b"/>
      <text x="30" y="36" text-anchor="middle" font-size="16" font-weight="700" fill="#ffffff">3</text>
      <circle cx="95" cy="78" r="34" fill="none" stroke="#b86b18" stroke-width="3"/>
      <circle cx="95" cy="78" r="19" fill="none" stroke="#b86b18" stroke-width="3"/>
      <circle cx="95" cy="78" r="5" fill="#b86b18"/>
      <path d="M122 51 L145 28" stroke="#b86b18" stroke-width="4" stroke-linecap="round"/>
      <text x="95" y="128" text-anchor="middle" font-size="15" font-weight="700" fill="#17212b">Target intervention</text>
    </g>

    <g transform="translate(745 62)">
      <rect width="190" height="140" rx="14" fill="#eaf5f3" stroke="#2a7f78" stroke-width="2" stroke-dasharray="6 4"/>
      <circle cx="30" cy="30" r="17" fill="#17212b"/>
      <text x="30" y="36" text-anchor="middle" font-size="16" font-weight="700" fill="#ffffff">4</text>
      <path d="M50 102 V62 H83" fill="none" stroke="#2a7f78" stroke-width="3"/>
      <path d="M83 102 V44 H116" fill="none" stroke="#2f6f9f" stroke-width="3"/>
      <path d="M116 102 V81 H149" fill="none" stroke="#b86b18" stroke-width="3" stroke-dasharray="5 3"/>
      <text x="95" y="128" text-anchor="middle" font-size="14" font-weight="700" fill="#17212b">Compare with control</text>
    </g>

    <text x="480" y="245" text-anchor="middle" font-size="13" fill="#5b6875">The intervention correspondence is evaluated within each protocol; controls are used where available.</text>
  </g>
</svg>
