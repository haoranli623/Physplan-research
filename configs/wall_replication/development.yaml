experiment: wall_protocol_development
protocol_version: development-1
seed: 20260820
device: cuda:0
checkpoint: artifacts/checkpoints/jepa_wm_wall.pth.tar
environment:
  name: wall
  wall_x: 32
  door_y: 30
  frameskip: 5
  latent_horizon: 6
candidate_set:
  geometry: two_segment_waypoint_y_grid
  samples: 41
  waypoint_y_min: 8.0
  waypoint_y_max: 56.0
  simulator_cost: terminal_euclidean_goal_distance_pixels
split:
  name: wall_dev
  seed_start: 1000000
  feasibility_only_seed_start: 1000000
  anchors: 60
  layouts:
    - [26, 18]
    - [26, 36]
    - [29, 24]
    - [32, 42]
    - [35, 18]
    - [38, 36]
readout:
  family: standard_scaler_ridge
  input: terminal_goal_delta_signed_absolute_squared_visual_plus_proprio
  reads_action: false
  ridge_alphas: [0.1, 1.0, 10.0, 100.0, 1000.0, 10000.0]
  grouped_folds: 5
search:
  family: fixed_uniform_waypoint_subset
  query_indices: [0, 4, 8, 12, 16, 20, 24, 28, 32, 36, 40]
metrics:
  top_k: 5
  pair_tie_tolerance_pixels: 0.05
  bootstrap_samples: 5000
  confidence: 0.95
predictor_repair_development:
  intervention: predictor_only_standard_latent_l2_finetune
  train_anchor_count: 48
  validation_anchor_count: 12
  maximum_epochs: 5
  batch_size: 8
  learning_rate: 0.00003
  weight_decay: 0.01
  visual_loss_weight: 1.0
  proprio_loss_weight: 0.1
  checkpoint_selection: minimum_validation_standard_latent_l2
  refit_on_all_dev: false
reserved_splits:
  diagnosis:
    seed_start: 1100000
    anchors: 80
    layouts: [[26, 24], [29, 42], [32, 18], [35, 36], [38, 30], [38, 48]]
  repair:
    seed_start: 1200000
    anchors: 80
    layouts: [[26, 30], [29, 18], [29, 48], [32, 36], [35, 24], [38, 42]]
outputs:
  cache: artifacts/wall_replication/development_features.npz
  result: results/wall_replication/development.json
