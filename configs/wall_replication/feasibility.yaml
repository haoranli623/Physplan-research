experiment: wall_feasibility_gate
protocol_version: feasibility-1
seed: 20260820
device: cuda:0
checkpoint: artifacts/checkpoints/jepa_wm_wall.pth.tar
environment:
  name: wall
  wall_x: 32
  door_y: 30
  frameskip: 5
  latent_horizon: 6
candidate_set:
  geometry: two_segment_waypoint_y_grid
  samples: 41
  waypoint_y_min: 8.0
  waypoint_y_max: 56.0
  simulator_cost: terminal_euclidean_goal_distance_pixels
split:
  feasibility_only_seed_start: 900000
  fit_anchors: 20
  heldout_anchors: 10
readout:
  family: standard_scaler_ridge
  input: terminal_goal_delta_signed_absolute_squared_visual_plus_proprio
  reads_action: false
  ridge_alphas: [0.1, 1.0, 10.0, 100.0, 1000.0, 10000.0]
  grouped_folds: 5
metrics:
  top_k: 5
  pair_tie_tolerance_pixels: 0.05
feasibility_requirements:
  exact_clone_max_abs_state_error: 0.0
  minimum_median_candidate_cost_range_pixels: 4.0
  minimum_heldout_mean_gt_spearman: 0.5
  maximum_heldout_mean_normalized_regret: 0.2
  minimum_simulator_candidates_per_second: 20.0
  maximum_estimated_120_anchor_hours: 4.0
outputs:
  cache: artifacts/wall_replication/feasibility_features.npz
  result: results/wall_replication/feasibility.json

