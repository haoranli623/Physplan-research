experiment: wall_frozen_repair_validation
protocol_version: 1
protocol: configs/wall_replication/protocol.yaml
seed: 20260820
device: cuda:0
checkpoint: artifacts/checkpoints/jepa_wm_wall.pth.tar
environment:
  name: wall
  wall_x: 32
  door_y: 30
  frameskip: 5
  latent_horizon: 6
